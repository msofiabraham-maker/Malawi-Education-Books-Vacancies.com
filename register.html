<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - MEBV</title>
    <!-- Favicon using standardized LOGO.png -->
    <link rel="icon" type="image/png" href="assets/LOGO.png">
    
    <!-- Fonts and Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        .register-page-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top right, rgba(10, 25, 49, 0.08), transparent 45%),
                        radial-gradient(circle at bottom left, rgba(223, 177, 91, 0.08), transparent 50%),
                        var(--color-bg-light);
            padding: 40px 24px;
        }
        .register-card {
            width: 100%;
            max-width: 500px;
            padding: 40px;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .register-logo-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .register-logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin: 0 auto 16px auto;
            animation: float 4s ease-in-out infinite;
        }
        .social-login-btn {
            width: 100%;
            padding: 12px;
            background: #FFF;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-weight: 600;
            color: var(--color-text-dark);
            cursor: pointer;
            transition: var(--transition-smooth);
            margin-bottom: 24px;
        }
        .social-login-btn:hover {
            background: #F8FAFC;
            border-color: #CBD5E1;
            transform: translateY(-1px);
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin-bottom: 24px;
            color: var(--color-text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--color-border);
        }
        .divider:not(:empty)::before { margin-right: .5em; }
        .divider:not(:empty)::after { margin-left: .5em; }

        .error-banner {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: var(--color-danger);
            padding: 12px;
            border-radius: var(--radius-sm);
            margin-bottom: 20px;
            font-size: 0.85rem;
            display: none;
            align-items: center;
            gap: 10px;
        }
        .strength-indicator {
            height: 4px;
            width: 100%;
            background: #E2E8F0;
            border-radius: 2px;
            margin-top: 8px;
            position: relative;
            overflow: hidden;
        }
        .strength-bar {
            height: 100%;
            width: 0;
            background: var(--color-danger);
            transition: var(--transition-smooth);
        }
    </style>
</head>
<body>

    <div class="register-page-wrapper">
        <div class="glass-card register-card">
            <div class="register-logo-header">
                <img src="assets/LOGO.png" alt="MEBV Shield Logo" class="register-logo">
                <h2>Create Your Account</h2>
                <p style="color: var(--color-text-muted); font-size: 0.9rem; margin-top: 8px;">Gain unrestricted downloads and track learning metrics instantly.</p>
            </div>

            <!-- Error Feedback Banner -->
            <div class="error-banner" id="error-message">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span id="error-text">Failed to complete registration.</span>
            </div>

            <!-- Google Sign Up Option -->
            <button class="social-login-btn" id="btn-google-signup">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google Icon" style="width: 18px; height: 18px;">
                Register with Google
            </button>

            <div class="divider">Or register with email</div>

            <!-- Registration Form -->
            <form id="register-form">
                <div class="form-group">
                    <label class="form-label" for="reg-fullname">Full Name</label>
                    <input type="text" id="reg-fullname" class="form-control" placeholder="e.g. Kondwani Phiri" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" class="form-control" placeholder="student@mebv.online" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-phone">Phone Number</label>
                    <input type="tel" id="reg-phone" class="form-control" placeholder="e.g. +265993984344" required>
                </div>

                <div class="form-group" style="margin-bottom: 12px;">
                    <label class="form-label" for="reg-password">Password</label>
                    <input type="password" id="reg-password" class="form-control" placeholder="Min. 8 characters" required>
                    <div class="strength-indicator">
                        <div class="strength-bar" id="password-strength-meter"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-confirm">Confirm Password</label>
                    <input type="password" id="reg-confirm" class="form-control" placeholder="Re-enter password" required>
                </div>

                <div class="form-group" style="margin-bottom: 24px;">
                    <label style="display: flex; align-items: flex-start; gap: 10px; color: var(--color-text-muted); font-size: 0.85rem; cursor: pointer; line-height: 1.4;">
                        <input type="checkbox" id="terms-accept" style="accent-color: var(--color-primary); margin-top: 3px;" required>
                        I acknowledge the terms of digital usage, permitting Malawi Education Books & Vacancies (MEBV) to store profile references for certificate and application tracking.
                    </label>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 24px;">
                    <i class="fa-solid fa-user-plus"></i> Initialize Account
                </button>
            </form>

            <p style="text-align: center; font-size: 0.9rem; color: var(--color-text-muted);">
                Already have an account? <a href="login.html" style="color: var(--color-primary); font-weight: 700;">Sign In</a>
            </p>
        </div>
    </div>

    <!-- Supabase Core Engine -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/app.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const form = document.getElementById('register-form');
            const errorBanner = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');
            const googleBtn = document.getElementById('btn-google-signup');
            const passwordInput = document.getElementById('reg-password');
            const confirmInput = document.getElementById('reg-confirm');
            const strengthMeter = document.getElementById('password-strength-meter');

            // 1. Live Password Strength Meter
            passwordInput.addEventListener('input', () => {
                const val = passwordInput.value;
                let strength = 0;
                
                if (val.length >= 8) strength += 25;
                if (/[A-Z]/.test(val)) strength += 25;
                if (/[0-9]/.test(val)) strength += 25;
                if (/[^A-Za-z0-9]/.test(val)) strength += 25;

                strengthMeter.style.width = `${strength}%`;
                if (strength <= 25) {
                    strengthMeter.style.background = 'var(--color-danger)';
                } else if (strength <= 75) {
                    strengthMeter.style.background = 'var(--color-warning)';
                } else {
                    strengthMeter.style.background = 'var(--color-success)';
                }
            });

            // 2. Submit Logic
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorBanner.style.display = "none";

                const fullname = document.getElementById('reg-fullname').value;
                const email = document.getElementById('reg-email').value;
                const phone = document.getElementById('reg-phone').value;
                const password = passwordInput.value;
                const confirm = confirmInput.value;

                if (password.length < 8) {
                    showError("Password must contain at least 8 characters.");
                    return;
                }

                if (password !== confirm) {
                    showError("Passwords do not match.");
                    return;
                }

                if (!MEBV.client) {
                    showError("Supabase connection unavailable.");
                    return;
                }

                try {
                    // Sign up user via standard Auth. Profile table handles linking with triggers automatically
                    const { data, error } = await MEBV.client.auth.signUp({
                        email: email,
                        password: password,
                        options: {
                            data: {
                                full_name: fullname,
                                phone_number: phone,
                                avatar_url: 'assets/LOGO.png'
                            }
                        }
                    });

                    if (error) {
                        showError(error.message);
                        return;
                    }

                    if (data.user) {
                        // Immediately insert manual fallback details into profile table in case database triggers latency
                        await MEBV.client.from('profiles').upsert({
                            id: data.user.id,
                            full_name: fullname,
                            phone_number: phone,
                            avatar_url: 'assets/LOGO.png',
                            role: 'registered_user'
                        });

                        MEBV.showModal(
                            "Account Created Successfully",
                            "Registration initiated. Please confirm your email inbox to verify ownership before signing in.",
                            `<a href="login.html" class="btn btn-primary">Sign In</a>`
                        );
                    }

                } catch (err) {
                    showError("Internal application processing exception occurred.");
                    console.error(err);
                }
            });

            // 3. Google Sign Up Trigger
            googleBtn.addEventListener('click', async () => {
                if (!MEBV.client) return;
                const { error } = await MEBV.client.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: window.location.origin + '/profile.html'
                    }
                });
                if (error) showError(error.message);
            });

            function showError(msg) {
                errorText.innerText = msg;
                errorBanner.style.display = "flex";
            }
        });
    </script>
</body>
</html>
